name: Actualizar datos de Mazar

on:
  schedule:
    - cron: "0 13 * * *"   # 08:00 en Ecuador (UTC-5)
  workflow_dispatch:        # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar-mazar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Descargar datos y reentrenar
        run: python scripts/actualizar.py
      - name: Guardar cambios
        run: |
          git config user.name "ecuanomia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/celec_mazar.csv data.json
          git diff --cached --quiet && exit 0
          git commit -m "Datos de Mazar al $(date -u +%F)"
          git pull --rebase origin main
          git push
