<!-- Pegar en una tarjeta HTML de Ghost -->
<iframe src="https://apagones.ecuanomia.com"
  id="app-apagones" title="Simulador de riesgo de apagones"
  style="width:100%;border:0;min-height:1700px" loading="lazy"></iframe>
<script>
  window.addEventListener('message', function (e) {
    if (e.origin === 'https://apagones.ecuanomia.com' && e.data && e.data.alto) {
      document.getElementById('app-apagones').style.height = e.data.alto + 'px';
    }
  });
</script>
